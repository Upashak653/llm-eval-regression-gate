name: LLM Eval Regression Gate

on:
  pull_request:
    paths:
      - "app/target_app/**"
      - "app/eval/**"
      - "baselines/**"
  workflow_dispatch: {}

jobs:
  eval-gate:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      # NOTE: actions/setup-python is skipped here. It tries to install its
      # own bundled Python via an MSI installer, which fails on this
      # self-hosted Windows runner (likely a permissions issue running
      # non-elevated). Since this runner IS the developer's own machine,
      # we use the `py` launcher instead of the bare `python` command —
      # `python` resolves to an unreliable Windows "app execution alias"
      # stub in this environment, while `py -3.12` correctly finds the
      # real, working Python 3.12 install.
      - name: Verify Python is available
        run: py -3.12 --version

      # venv/ is git-ignored (correctly), so the runner's fresh checkout
      # has no venv — create one here each run, scoped to this job's
      # workspace, rather than relying on any pre-existing environment.
      - name: Create venv and install dependencies
        run: |
          py -3.12 -m venv venv
          .\venv\Scripts\pip install -r requirements.txt

      # This runner is YOUR machine, with Ollama already running locally
      # (localhost:11434) and the required models already pulled
      # (gemma4:31b-cloud, nomic-embed-text). gemma4:31b-cloud has shown
      # intermittent short-lived-session 404s even right after a
      # successful call — handled via retry-with-backoff inside
      # OllamaClient itself (app/target_app/llm_client.py), rather than
      # a one-time warm-up step here.
      - name: Run eval regression gate
        run: .\venv\Scripts\pytest tests/test_regression.py -v

      - name: Upload eval scores
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-scores
          path: baselines/baseline_scores.json